# plugins specs
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# bindings
set -g prefix C-t
unbind C-b
setw -g mode-keys vi
set-window-option -g window-status-current-style bg=blue,fg=white

bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"

set -g status-bg cyan
set -g status-right '#{prefix_highlight} %a %Y-%m-%d %H:%M'
set -g extended-keys on

# popup tig
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "tig"

# resurrection
set -g @resurrect-processes 'tig "tig -a" "npm start" "claude->claude --continue"'

# continumm
set -g @continuum-restore 'on'

# claude
set -g @plugin 'git@github.com:hshn/tmux-agent-monitor'
set -g window-status-format '#I:#W #{agent_status}'
set -g window-status-current-format '#I:#W #{agent_status}'
set -g @agent-status-glyph-working "🤔"
set -g @agent-status-glyph-waiting_input "💬"
set -g @agent-status-glyph-waiting_approval "⛔️"
set -g @agent-status-glyph-done "✅"
set -g @agent-status-glyph-error "👺"

# tpm initialization
run '~/.tmux/plugins/tpm/tpm'
